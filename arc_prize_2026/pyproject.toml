[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "arc2026-solver"
version = "0.2.0"
description = "Hybrid symbolic program synthesis baseline for ARC Prize 2026 ARC-AGI-2"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
